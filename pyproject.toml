[project]
name = "RemoteIntercom"
version = "0.1.0"

[project.optional-dependencies]
stubs = [
    "micropython-esp8266-stubs>=1.29.0,<1.30.0"
]

[tool.pyright]
include = ["src"]

stubPath = "typings"
typeshedPath = "typings"
pythonVersion = "3.10"

reportMissingModuleSource = "none"

[tool.ruff]
line-length = 100
target-version = "py310"
builtins = ["ptr", "ptr8", "ptr16", "ptr32", "uint", "micropython", "const"]
