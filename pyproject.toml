[project]
name = "RemoteIntercom"
version = "0.1.0"

[project.optional-dependencies]
stubs = [
    "micropython-esp8266-stubs>=1.29.0,<1.30.0"
]

[tool.pyright]
include = ["src"]
extraPaths = ["src/lib"]

stubPath = "typings"
typeshedPath = "typings"
pythonVersion = "3.10"

reportMissingModuleSource = "none"

[tool.mypy]
python_version = "3.10"

# Resolve core modules from custom Typeshed before device runtime shims.
mypy_path = ["typings/stdlib", "typings", "src/lib"]
custom_typeshed_dir = "typings"
files = "src"
exclude = [
    "typings[\\/].*",
    "src[\\/]lib[\\/]typing\\.py$",
]

follow_imports = "silent"
follow_imports_for_stubs = true
no_site_packages = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
builtins = ["ptr", "ptr8", "ptr16", "ptr32", "uint", "micropython", "const"]

lint.ignore = ["EXE005"]
